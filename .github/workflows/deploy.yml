# Build and deploy to Dreamhost on every push to main.
#
# This is what makes the phone path work. You never need to run `npm run build`
# locally, so any commit that reaches GitHub — from Dispatch, the GitHub mobile
# app, or a git client on your phone — ships the site.
#
# ONE-TIME SETUP: exactly one secret.
#
#   Generate a deploy key (a new one, not your personal key):
#     ssh-keygen -t ed25519 -f ./deploy_key -N ""
#
#   Append deploy_key.pub to ~/.ssh/authorized_keys on Dreamhost:
#     ssh-copy-id -i ./deploy_key.pub josepilove@iad1-shared-b8-12.dreamhost.com
#
#   Paste the contents of deploy_key into
#     Settings → Secrets and variables → Actions → New secret
#     name: DREAMHOST_SSH_KEY
#
#   Then delete deploy_key locally. Keep deploy_key.pub if you like.
#
# Host, user and path are below in plain text on purpose — they aren't secrets,
# and hardcoding them means there's only one thing to configure.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # rebuild by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DH_HOST: iad1-shared-b8-12.dreamhost.com
  DH_USER: josepilove
  DH_PATH: /home/josepilove/workinozaukee.org/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fail if the committed cheat sheets have drifted from the schema.
      - name: Check vocabulary is current
        run: |
          npm run vocab
          if ! git diff --quiet -- src/content; then
            echo "::error::_vocabulary.md is out of date. Run 'npm run vocab' and commit."
            git diff --stat -- src/content
            exit 1
          fi

      # Schema violations fail here, before anything reaches the server.
      - run: npm run build

      - name: Guard against an empty build
        run: test -f dist/index.html

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DREAMHOST_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # rsync rather than lftp: it's preinstalled on the runner, faster over a
      # slow link, and --delete semantics match `mirror -R --delete`.
      - name: Deploy to Dreamhost
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            --exclude '.DS_Store' \
            dist/ \
            "$DH_USER@$DH_HOST:$DH_PATH"
